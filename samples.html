<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Samples — Adored</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #14110f;
        --ink: #f4efe7;
        --mute: #9a9085;
        --card: #fff;
        --ember: #c45c26;
        --pine: #243d36;
        --lamp: #d4a574;
        --panel: #1c1714;
        --line: rgba(244, 239, 231, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Outfit", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 50% 40% at 90% 0%, rgba(196, 92, 38, 0.22), transparent 55%),
          radial-gradient(ellipse 40% 35% at 0% 20%, rgba(36, 61, 54, 0.35), transparent 50%),
          var(--page);
        line-height: 1.5;
        min-height: 100vh;
      }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 1.25rem 1.1rem 3rem; }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.35rem;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        color: var(--ink);
        text-decoration: none;
        font-family: "Allura", cursive;
        font-weight: 400;
        font-size: 2.05rem;
        letter-spacing: 0.02em;
        line-height: 1;
      }
      .back-mark {
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: rgba(244, 239, 231, 0.08);
        border: 1px solid var(--line);
        transition: background 0.25s ease;
      }
      .back:hover .back-mark { background: rgba(196, 92, 38, 0.25); }
      .topbar-note {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--lamp);
        font-weight: 600;
      }

      .chooser {
        position: sticky;
        top: 0;
        z-index: 40;
        margin: 0 -0.25rem 1.25rem;
        padding: 0.85rem 0.25rem 1rem;
        background: linear-gradient(180deg, rgba(20,17,15,.94) 55%, rgba(20,17,15,0));
        backdrop-filter: blur(12px);
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
      }
      .tab {
        appearance: none;
        border: 1px solid var(--line);
        background:
          linear-gradient(160deg, rgba(244,239,231,0.06), rgba(244,239,231,0.02));
        color: var(--ink);
        border-radius: 1.15rem;
        min-height: 5.4rem;
        padding: 1rem 1rem 0.95rem;
        text-align: left;
        cursor: pointer;
        transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
        position: relative;
        overflow: hidden;
      }
      .tab::before {
        content: "";
        position: absolute;
        inset: auto -20% -40% auto;
        width: 7rem;
        height: 7rem;
        border-radius: 50%;
        background: rgba(196, 92, 38, 0.12);
        transition: transform .35s ease, opacity .35s ease;
      }
      .tab:nth-child(2)::before { background: rgba(36, 61, 54, 0.35); }
      .tab:nth-child(3)::before { background: rgba(212, 165, 116, 0.18); }
      .tab:nth-child(4)::before { background: rgba(224, 122, 95, 0.22); }
      .tab:hover {
        transform: translateY(-3px);
        border-color: rgba(244, 239, 231, 0.28);
      }
      .tab.is-active {
        border-color: rgba(196, 92, 38, 0.7);
        background:
          linear-gradient(160deg, rgba(196, 92, 38, 0.22), rgba(28, 23, 20, 0.9));
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      }
      .tab.is-active::before { transform: scale(1.3); opacity: 0.9; }
      .tab-kicker {
        display: block;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--lamp);
        margin-bottom: 0.45rem;
        position: relative;
      }
      .tab-label {
        display: block;
        font: 750 1.2rem/1.1 "Syne", sans-serif;
        letter-spacing: -0.03em;
        position: relative;
      }
      .tab-hint {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.78rem;
        color: var(--mute);
        position: relative;
      }

      .empty {
        display: none;
        margin-top: 2.5rem;
        padding: 2.5rem 1.25rem;
        border: 1px dashed rgba(244, 239, 231, 0.18);
        border-radius: 1.5rem;
        text-align: center;
        color: var(--mute);
      }
      .empty.is-visible { display: block; }
      .empty strong {
        display: block;
        font-family: "Syne", sans-serif;
        font-size: 1.4rem;
        color: var(--ink);
        margin-bottom: 0.4rem;
        letter-spacing: -0.02em;
      }

      .panel { display: none; }
      .panel.is-active { display: block; animation: rise 0.45s ease; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }

      .grid {
        display: grid;
        gap: 1.15rem;
        grid-template-columns: 1fr;
      }
      @media (min-width: 900px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* Manual news-style sample slider */
      .sample-slider {
        position: relative;
        border-radius: 1.35rem;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
      }

      .sample-slider-viewport {
        overflow: hidden;
        width: 100%;
      }

      .sample-slider-track {
        display: flex;
        transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
      }

      .sample-slide {
        flex: 0 0 100%;
        min-width: 100%;
        padding: 0.85rem;
        box-sizing: border-box;
      }

      .sample-slide .card {
        margin: 0;
        height: 100%;
      }

      .sample-slider-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem 1rem;
      }

      .sample-slider-dots {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        flex: 1;
        min-height: 0.55rem;
      }

      .sample-dot {
        appearance: none;
        border: 0;
        padding: 0;
        width: 1.15rem;
        height: 0.22rem;
        border-radius: 999px;
        background: rgba(244, 239, 231, 0.28);
        cursor: pointer;
        transition: background 0.25s ease, width 0.25s ease;
      }

      .sample-dot.is-active {
        background: #fff;
        width: 1.55rem;
      }

      .sample-slider-nav {
        display: flex;
        gap: 0.45rem;
        flex-shrink: 0;
      }

      .sample-nav-btn {
        width: 2.35rem;
        height: 2.35rem;
        border: 0;
        border-radius: 0.65rem;
        background: rgba(244, 239, 231, 0.16);
        color: #fff;
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.25s ease;
      }

      .sample-nav-btn:hover {
        background: rgba(244, 239, 231, 0.28);
      }

      .sample-nav-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .card {
        background: var(--card);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 18px 42px rgba(23, 20, 15, 0.1);
        border: 1px solid rgba(23, 20, 15, 0.06);
      }
      .card-meta { padding: 1rem 1.1rem 0.5rem; }
      .tag {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #7a3b2e;
        margin-bottom: 0.28rem;
      }
      .card-meta h2 {
        margin: 0 0 0.28rem;
        font-family: "Syne", sans-serif;
        font-size: 1.12rem;
        letter-spacing: -0.02em;
      }
      .card-meta p { margin: 0; font-size: 0.86rem; color: var(--mute); }
      .swatches { display: flex; gap: 0.4rem; padding: 0.55rem 1.1rem 0.8rem; }
      .swatch {
        width: 1.75rem; height: 1.75rem; border-radius: 999px;
        border: 1px solid rgba(0,0,0,.1);
      }
      .preview {
        min-height: 240px;
        display: grid;
        grid-template-columns: 0.92fr 1.18fr;
        overflow: hidden;
      }
      .side, .main {
        padding: 1rem 0.95rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; font-family: "Syne", sans-serif;
      }
      .side-nav {
        list-style: none; margin: 1rem 0 0; padding: 0;
        font-size: 0.78rem; display: grid; gap: 0.4rem; opacity: 0.88;
      }
      .hero-title {
        font-family: "Syne", sans-serif;
        font-size: 1.22rem; line-height: 1.12; letter-spacing: -0.03em;
        margin: 0 0 0.4rem; max-width: 12ch;
      }
      .hero-text { font-size: 0.8rem; opacity: 0.82; max-width: 28ch; margin: 0 0 0.85rem; }
      .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
      .btn {
        border: 0; border-radius: 999px; padding: 0.48rem 0.82rem;
        font-size: 0.74rem; font-weight: 700; font-family: inherit;
      }
      .btn-ghost { background: transparent; border: 1px solid currentColor; }
      .chips { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.75rem; }
      .chip { font-size: 0.66rem; padding: 0.24rem 0.5rem; border-radius: 999px; }
      .codes {
        padding: 0.65rem 1.1rem 0.95rem; font-size: 0.72rem; color: var(--mute);
        border-top: 1px solid rgba(0,0,0,.05);
      }
      .codes code {
        font-family: ui-monospace, monospace; background: #efe8de;
        padding: 0.08rem 0.28rem; border-radius: 4px; color: #333;
      }

      .logo-stage {
        min-height: 168px; display: grid; place-items: center; padding: 1.25rem 1rem;
      }
      .logo-mark { display: flex; align-items: center; gap: 0.75rem; }
      .name {
        font-family: "Syne", sans-serif; font-weight: 700;
        letter-spacing: -0.03em; line-height: 1.05;
      }
      .sub {
        display: block; font-size: 0.66rem; font-weight: 600;
        letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.72; margin-top: 0.2rem;
      }
      .complete-logo-bar {
        display: flex; align-items: center; justify-content: center; gap: 0.75rem;
        padding: 1.05rem 1rem; min-height: 92px;
        border-bottom: 1px solid rgba(0,0,0,.05);
      }
      .match-note {
        padding: 0.65rem 1.1rem 0.95rem; font-size: 0.78rem; color: var(--mute);
        border-top: 1px solid rgba(0,0,0,.05);
      }

      .live-studio {
        display: grid;
        gap: 1.1rem;
      }
      @media (min-width: 900px) {
        .live-studio {
          grid-template-columns: 0.9fr 1.2fr;
          align-items: start;
        }
      }
      .live-controls, .live-preview-wrap {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        padding: 1.1rem;
      }
      .live-controls h3, .live-preview-wrap h3 {
        margin: 0 0 0.85rem;
        font-family: "Syne", sans-serif;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }
      .color-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 0.55rem;
        align-items: center;
        margin-bottom: 0.7rem;
      }
      .color-row label {
        font-size: 0.84rem;
        color: var(--mute);
      }
      .color-row input[type="color"] {
        width: 2.4rem;
        height: 2.4rem;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }
      .color-row input[type="text"] {
        width: 6.2rem;
        border: 1px solid var(--line);
        background: rgba(0,0,0,0.25);
        color: var(--ink);
        border-radius: 0.55rem;
        padding: 0.45rem 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
      }
      .preset-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-top: 0.85rem;
      }
      .preset {
        border: 1px solid var(--line);
        background: rgba(244,239,231,0.06);
        color: var(--ink);
        border-radius: 999px;
        padding: 0.4rem 0.7rem;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .preset:hover { border-color: var(--ember); }
      .live-preview {
        min-height: 280px;
        display: grid;
        grid-template-columns: 0.9fr 1.2fr;
        border-radius: 1rem;
        overflow: hidden;
      }
      .live-logo-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
        padding: 0.9rem;
        border-radius: 0.9rem;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .live-preview .side,
      .live-preview .main {
        transition: background 0.2s ease, color 0.2s ease;
      }
      .live-preview .btn {
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }

          `<svg width="64" height="64" viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="8" fill="none" stroke="#1a2e28" stroke-width="3"/><rect x="16" y="16" width="32" height="32" rx="6" fill="#c4784a"/><text x="32" y="38" text-anchor="middle" fill="#e8f4ef" font-family="Syne, sans-serif" font-size="14" font-weight="700">SV</text></svg>`, "Systems"],
        ["X", "Signal arc", "Arc + node — signal / connection energy.", "#f2eaf8", "#2c1e3a",
          `<svg width="72" height="64" viewBox="0 0 72 64"><path d="M10 48 C24 18 48 18 62 48" fill="none" stroke="#2c1e3a" stroke-width="3.5" stroke-linecap="round"/><circle cx="36" cy="28" r="5" fill="#7a5a9a"/><text x="36" y="56" text-anchor="middle" fill="#2c1e3a" font-family="Syne, sans-serif" font-size="12" font-weight="700">SV</text></svg>`, "Connect"],
      ];

      const combos = [
        [1,0,"Ink & ember set","Warm copper on dark official base."],
        [2,1,"Pine & sand set","Natural and current — grounded and calm."],
        [3,2,"Noir atelier set","Dark editorial premium."],
        [4,3,"Coastal steel set","Cool + warm contrast."],
        [5,4,"Stone & moss set","Quiet creative direction."],
        [6,5,"Clay archive set","Warm and rare for this industry."],
        [7,6,"Teal & amber set","Sharp amber actions on deep teal."],
        [8,7,"Violet dusk set","Unexpected pairing, architectural mark."],
        [9,8,"Harbor night set","Coastal night blue with apricot ribbon seal."],
        [10,9,"Espresso mint set","Espresso + mint with a notched mark."],
        [11,10,"Garden dusk set","Forest and lilac with a soft wave."],
        [12,11,"Cedar frost set","Cedar warmth with frost brackets."],
        [1,12,"Ember diamond set","Copper diamond on ink & ember colors."],
        [2,13,"Pine capsule set","Soft capsule wordmark on pine & sand."],
        [3,14,"Atelier hatch set","Textured hatch badge on noir colors."],
        [4,15,"Steel trail set","Dot-trail process mark on coastal steel."],
        [13,16,"Olive hex set","Olive apricot with hex stamp mark."],
        [14,17,"Plum crosshair set","Plum frost with soft crosshair."],
        [15,18,"Fern book set","Fern terracotta with book-fold mark."],
        [16,19,"Horizon pillar set","Ink horizon with pillar structure."],
        [17,20,"Walnut leaf set","Walnut sage with corner leaf."],
        [18,21,"Midnight bar set","Midnight coral with horizon bar wordmark."],
        [13,22,"Olive systems set","Nested squares on olive apricot."],
        [14,23,"Plum signal set","Signal arc on plum frost."],
      ];

      function siteCard([id, title, desc, cls, codes], compact = false) {
        return `<article class="card ${cls}">
          <div class="card-meta"><div class="tag">Website ${id}</div><h2>${title}</h2><p>${desc}</p></div>
          <div class="swatches"><div class="swatch s1"></div><div class="swatch s2"></div><div class="swatch s3"></div><div class="swatch s4"></div></div>
          <div class="preview" style="${compact ? "min-height:210px" : ""}">
            <div class="side"><div class="brand">Your Business</div><ul class="side-nav"><li>Services</li><li>About</li><li>Contact</li></ul></div>
            <div class="main"><div>
              <h3 class="hero-title">Clear online presence for your services.</h3>
              <p class="hero-text">A clear online presence for your services — simple, trustworthy, easy to update.</p>
              <div class="actions"><button class="btn btn-main">Call now</button><button class="btn btn-ghost">Services</button></div>
            </div><div class="chips"><span class="chip">Services</span><span class="chip">Contact</span></div></div>
          </div>
          <div class="codes">${codes.map(c => `<code>${c}</code>`).join(" ")}</div>
        </article>`;
      }

      function logoCard([id, title, desc, bg, fg, mark, sub]) {
        return `<article class="card">
          <div class="card-meta"><div class="tag">Logo ${id}</div><h2>${title}</h2><p>${desc}</p></div>
          <div class="logo-stage" style="background:${bg}">
            <div class="logo-mark" style="color:${fg}">
              ${mark}
              ${sub ? `<div><div class="name" style="font-size:1.28rem">Brand Co</div><span class="sub">${sub}</span></div>` : ""}
            </div>
          </div>
        </article>`;
      }

      function comboCard([siteIdx, logoIdx, title, note], i) {
        const site = sites[siteIdx - 1];
        const logo = logos[logoIdx];
        const [, , , cls] = site;
        const [, , , bg, fg, mark, sub] = logo;
        return `<article class="card">
          <div class="card-meta"><div class="tag">Combination ${i + 1}</div><h2>${title}</h2><p>Website ${site[0]} + Logo ${logo[0]}</p></div>
          <div class="complete-logo-bar" style="background:${bg};color:${fg}">
            ${mark}
            ${sub ? `<div><div class="name" style="font-size:1.2rem">Brand Co</div><span class="sub">${sub}</span></div>` : ""}
          </div>
          <div class="preview ${cls}" style="min-height:210px">
            <div class="side"><div class="brand">Your Business</div><ul class="side-nav"><li>Services</li><li>About</li><li>Contact</li></ul></div>
            <div class="main"><div>
              <h3 class="hero-title">Clear online presence for your services.</h3>
              <p class="hero-text">A clear online presence for your services — simple, trustworthy, easy to update.</p>
              <div class="actions"><button class="btn btn-main">Call now</button><button class="btn btn-ghost">Services</button></div>
            </div><div class="chips"><span class="chip">Services</span><span class="chip">Contact</span></div></div>
          </div>
          <div class="match-note">${note}</div>
        </article>`;
      }

      /* —— Manual slidable samples (arrows + dashes, no autoplay) —— */
      function buildSlider(name, htmlSlides) {
        const root = document.querySelector(`[data-slider="${name}"]`);
        const track = document.getElementById(`${name}-track`);
        const dotsWrap = document.getElementById(`${name}-dots`);
        const prevBtn = root.querySelector("[data-prev]");
        const nextBtn = root.querySelector("[data-next]");
        let index = 0;
        const total = htmlSlides.length;

        track.innerHTML = htmlSlides.map((html) => `<div class="sample-slide">${html}</div>`).join("");
        dotsWrap.innerHTML = htmlSlides
          .map((_, i) => `<button class="sample-dot" type="button" data-dot="${i}" aria-label="Go to sample ${i + 1}"></button>`)
          .join("");

        const dots = [...dotsWrap.querySelectorAll(".sample-dot")];

        function goTo(next) {
          index = (next + total) % total;
          track.style.transform = `translateX(-${index * 100}%)`;
          dots.forEach((dot, i) => dot.classList.toggle("is-active", i === index));
          prevBtn.disabled = false;
          nextBtn.disabled = false;
        }

        prevBtn.addEventListener("click", () => goTo(index - 1));
        nextBtn.addEventListener("click", () => goTo(index + 1));
        dotsWrap.addEventListener("click", (e) => {
          const dot = e.target.closest("[data-dot]");
          if (!dot) return;
          goTo(Number(dot.dataset.dot));
        });

        let touchX = null;
        track.addEventListener(
          "touchstart",
          (e) => {
            touchX = e.changedTouches[0].clientX;
          },
          { passive: true }
        );
        track.addEventListener(
          "touchend",
          (e) => {
            if (touchX == null) return;
            const dx = e.changedTouches[0].clientX - touchX;
            touchX = null;
            if (Math.abs(dx) < 40) return;
            goTo(dx < 0 ? index + 1 : index - 1);
          },
          { passive: true }
        );

        goTo(0);
      }

      buildSlider(
        "website",
        sites.map((s) => siteCard(s))
      );
      buildSlider(
        "logo",
        logos.map((l) => logoCard(l))
      );
      buildSlider(
        "combo",
        combos.map((c, i) => comboCard(c, i))
      );

      /* —— Live palette —— */
      const palette = { side: "#1C2430", accent: "#C45C26", main: "#F0EBE2", text: "#1C2430" };

      function normalizeHex(v) {
        let h = String(v || "").trim();
        if (!h.startsWith("#")) h = "#" + h;
        if (/^#[0-9a-fA-F]{3}$/.test(h)) {
          h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
        }
        return /^#[0-9a-fA-F]{6}$/.test(h) ? h.toUpperCase() : null;
      }

      function applyLive() {
        const { side, accent, main, text } = palette;
        const sideEl = document.getElementById("live-side");
        const mainEl = document.getElementById("live-main");
        const btn = document.getElementById("live-btn");
        const ghost = document.getElementById("live-ghost");
        const chip1 = document.getElementById("live-chip1");
        const chip2 = document.getElementById("live-chip2");
        const logoRow = document.getElementById("live-logo-row");
        const logoBg = document.getElementById("live-logo-bg");
        const logoArc = document.getElementById("live-logo-arc");
        const logoName = document.getElementById("live-logo-name");
        const logoSub = document.getElementById("live-logo-sub");
        const logoSvgText = document.querySelector("#live-logo-svg text");

        sideEl.style.background = side;
        sideEl.style.color = main;
        mainEl.style.background = main;
        mainEl.style.color = text;
        btn.style.background = accent;
        btn.style.color = "#fff";
        ghost.style.background = "transparent";
        ghost.style.color = text;
        ghost.style.border = "1px solid " + text;
        chip1.style.background = accent + "24";
        chip1.style.color = text;
        chip2.style.background = accent + "24";
        chip2.style.color = text;
        logoRow.style.background = main;
        logoRow.style.color = text;
        logoBg.setAttribute("fill", side);
        logoArc.setAttribute("stroke", accent);
        if (logoSvgText) logoSvgText.setAttribute("fill", main);
        logoName.style.color = text;
        logoSub.style.color = text;

        document.getElementById("c-side").value = side;
        document.getElementById("c-accent").value = accent;
        document.getElementById("c-main").value = main;
        document.getElementById("c-text").value = text;
        document.getElementById("t-side").value = side;
        document.getElementById("t-accent").value = accent;
        document.getElementById("t-main").value = main;
        document.getElementById("t-text").value = text;
      }

      function setPalette(side, accent, main, text) {
        palette.side = normalizeHex(side) || palette.side;
        palette.accent = normalizeHex(accent) || palette.accent;
        palette.main = normalizeHex(main) || palette.main;
        palette.text = normalizeHex(text) || palette.text;
        applyLive();
      }

      document.getElementById("preset-row").innerHTML = sites.map((s) => {
        const [, title, , , , live] = s;
        const [side, accent, main, text] = live;
        return `<button class="preset" type="button" data-side="${side}" data-accent="${accent}" data-main="${main}" data-text="${text}">${title}</button>`;
      }).join("");

      document.getElementById("preset-row").addEventListener("click", (e) => {
        const btn = e.target.closest(".preset");
        if (!btn) return;
        setPalette(btn.dataset.side, btn.dataset.accent, btn.dataset.main, btn.dataset.text);
      });

      ["side", "accent", "main", "text"].forEach((key) => {
        document.getElementById("c-" + key).addEventListener("input", (e) => {
          palette[key] = e.target.value.toUpperCase();
          applyLive();
        });
        document.getElementById("t-" + key).addEventListener("change", (e) => {
          const hex = normalizeHex(e.target.value);
          if (hex) {
            palette[key] = hex;
            applyLive();
          } else {
            e.target.value = palette[key];
          }
        });
      });

      document.getElementById("copy-palette").addEventListener("click", async () => {
        const text = `Sidebar: ${palette.side}\nAccent: ${palette.accent}\nMain: ${palette.main}\nText: ${palette.text}`;
        const btn = document.getElementById("copy-palette");
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = "Copied!";
        } catch {
          btn.textContent = "Copy failed — select manually";
        }
        setTimeout(() => { btn.textContent = "Copy palette hex codes"; }, 1600);
      });

      applyLive();

      const tabs = [...document.querySelectorAll(".tab")];
      const panels = {
        website: document.getElementById("panel-website"),
        logo: document.getElementById("panel-logo"),
        combo: document.getElementById("panel-combo"),
        live: document.getElementById("panel-live"),
      };

      function activate(name) {
        tabs.forEach((tab) => {
          const on = tab.dataset.tab === name;
          tab.classList.toggle("is-active", on);
          tab.setAttribute("aria-selected", on ? "true" : "false");
        });
        Object.entries(panels).forEach(([key, panel]) => {
          const on = key === name;
          panel.classList.toggle("is-active", on);
          panel.hidden = !on;
        });
        const empty = document.getElementById("empty-state");
        if (empty) empty.classList.remove("is-visible");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      tabs.forEach((tab) => tab.addEventListener("click", () => activate(tab.dataset.tab)));
    </script>
